[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trialledger"
version = "0.1.0"
description = "Offline, dependency-free validation and uncertainty reports for aligned ML predictions"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Fauzan Ishtiaq"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
trialledger = "trialledger.cli:main"

[tool.setuptools.packages.find]
include = ["trialledger*"]
